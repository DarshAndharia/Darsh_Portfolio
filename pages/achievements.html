<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achievements | Darsh</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="../index.html" id="nav-brand">Darsh<span>Andharia</span>.</a>
    <div class="d-flex align-items-center gap-3 order-lg-last">
      <div class="theme-toggle" id="themeToggle"><span class="toggle-icon" id="toggleIcon">🌙</span><div class="toggle-switch"></div></div>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
    </div>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto gap-1 py-2 py-lg-0">
        <li class="nav-item"><a class="nav-link" href="../index.html#hero">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="../index.html#education">Education</a></li>
        <li class="nav-item"><a class="nav-link" href="../index.html#internships">Internships</a></li>
        <li class="nav-item"><a class="nav-link" href="../index.html#projects">Projects</a></li>
        <li class="nav-item"><a class="nav-link active-section" href="../index.html#achievements">Achievements</a></li>
        <li class="nav-item"><a class="nav-link" href="../index.html#resume">Resume</a></li>
        <li class="nav-item"><a class="nav-link" href="../index.html#contact">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="detail-hero page-offset">
  <div class="container">
    <a href="../index.html#achievements" class="back-link"><i class="bi bi-arrow-left"></i> Back to Home</a>
    <span class="section-label">Milestones</span>
    <h1 class="detail-title">Achievements</h1>
    <div class="section-divider"></div>
    <p class="section-subtitle" style="max-width:560px;">Awards, certifications, competitions, and leadership roles that define my journey.</p>
  </div>
</div>

<div class="detail-content">
  <div class="container" id="achievements-detail-list"></div>
</div>

<footer>
  <div class="container">
    <div class="footer-brand" id="footer-brand">Darsh<span>Andharia</span>.</div>
    <div class="footer-social" id="footer-social"></div>
    <p class="footer-text">Crafted by Darsh &nbsp;·&nbsp; <span id="current-year"></span></p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  let D;
  try {
    D = PORTFOLIO_DATA;
  } catch (e) {
    console.error("Global portfolio contexts not loaded directly:", e);
  }

  if (!D) {
    console.error("Could not find PORTFOLIO_DATA. Check path configuration to your data.js file.");
    document.getElementById('achievements-detail-list').innerHTML = `
      <div class="text-center py-5">
        <i class="bi bi-exclamation-octagon text-danger" style="font-size: 3rem;"></i>
        <p class="mt-3 text-secondary">Unable to load achievement entries. Please verify data script assets.</p>
      </div>`;
    return;
  }

  document.getElementById('nav-brand').innerHTML = `${D.personal.firstName}<span>${D.personal.lastName}</span>.`;
  document.getElementById('footer-brand').innerHTML = `${D.personal.firstName}<span>${D.personal.lastName}</span>.`;

  const container = document.getElementById('achievements-detail-list');
  container.innerHTML = '';

  D.achievements.forEach((ach, i) => {
    const isEven = i % 2 === 0;
    container.innerHTML += `
      <div id="${ach.id}" class="row g-5 mb-5 pb-5 align-items-center ${i < D.achievements.length - 1 ? 'border-bottom' : ''}" style="border-color:var(--border)!important;">
        <div class="col-lg-6 ${isEven ? 'order-1' : 'order-lg-2'} reveal visible">
          ${ach.image
            ? `<div class="detail-image-main" style="
                  height: 480px; 
                  max-width: 100%; 
                  width: max-content;
                  margin: 0 auto; 
                  border-radius: 16px; 
                  overflow: hidden; 
                  border: 1px solid var(--border); 
                  box-shadow: var(--shadow-lg);
                  background: transparent;
                ">
                  <img src="../${ach.image}" alt="${ach.title}" style="height: 100%; width: auto; object-fit: contain; display: block;" />
                </div>`
            : `<div class="detail-image-main">
                <div class="detail-image-placeholder" style="height:250px;">
                  <span style="font-size:5rem;">${ach.icon}</span>
                  <p style="margin-top:12px;">Upload achievement photo / certificate</p>
                </div>
              </div>`}
        </div>
        <div class="col-lg-6 ${isEven ? 'order-2' : 'order-lg-1'} reveal visible">
          <span class="detail-badge">${ach.category}</span>
          <h2 style="font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;margin-bottom:12px;letter-spacing:-0.02em;color:var(--text-primary);">${ach.title}</h2>
          <div class="info-box" style="margin-bottom:16px;">
            <div class="info-box-label">Issued By</div>
            <div class="info-box-value">${ach.issuer}</div>
          </div>
          <div class="info-box" style="margin-bottom:16px;">
            <div class="info-box-label">Date</div>
            <div class="info-box-value">${ach.date}</div>
          </div>
          <p style="color:var(--text-secondary);line-height:1.75;font-size:0.95rem;">${ach.description}</p>
        </div>
      </div>`;
  });

  const socialHtml = `
    <a href="${D.personal.github}" target="_blank" class="social-btn"><i class="bi bi-github"></i></a>
    <a href="${D.personal.linkedin}" target="_blank" class="social-btn"><i class="bi bi-linkedin"></i></a>`;
  document.getElementById('footer-social').innerHTML = socialHtml;
});
</script>
</body>
</html>
