</head>
<body>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto gap-1 py-2 py-lg-0">
        <li class="nav-item"><a class="nav-link" href="../index.html#hero">Home</a></li>

<div class="detail-hero page-offset">
  <div class="container">
    <a href="../index.html#education" class="back-link"><i class="bi bi-arrow-left"></i> Back to Home</a>
    <span class="section-label">Academic Background</span>
    <h1 class="detail-title">Education</h1>
    <div class="section-divider"></div>
    <p class="section-subtitle" style="max-width:560px;">A complete overview of my academic journey — degrees, grades, courses, and milestones.</p>
  </div>
</div>

<div class="detail-content">
  <div class="container">
    <div id="education-detail-list">
      </div>
  </div>
</div>

<footer>
  <div class="container">
    <div class="footer-brand" id="footer-brand">Darsh<span>Andharia</span>.</div>
    <div class="footer-social" id="footer-social"></div>
    <p class="footer-text">Crafted by Darsh &nbsp;·&nbsp; <span id="current-year"></span></p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/main.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Safe Fallback initialization check for global data
  let D;
  try {
    D = PORTFOLIO_DATA;
  } catch (e) {
    console.error("Global portfolio context not loaded directly:", e);
  }

  if (!D) {
    console.error("Could not find PORTFOLIO_DATA. Check path configuration to your data.js file.");
    document.getElementById('education-detail-list').innerHTML = `
      <div class="text-center py-5">
        <i class="bi bi-excounter-octagon text-danger" style="font-size: 3rem;"></i>
        <p class="mt-3 text-secondary">Unable to load application data. Please ensure script paths are correct.</p>
      </div>`;
    return;
  }

  // Set branding details dynamically
  document.getElementById('nav-brand').innerHTML = `${D.personal.firstName}<span>${D.personal.lastName}</span>.`;
  document.getElementById('footer-brand').innerHTML = `${D.personal.firstName}<span>${D.personal.lastName}</span>.`;

  const list = document.getElementById('education-detail-list');
  list.innerHTML = ''; // Clear original placeholder items if any

  D.education.forEach((edu, i) => {
    // Generate skill tag elements from the data file array cleanly
    const coursesHtml = edu.courses && edu.courses.length > 0 
      ? edu.courses.map(c => `<span class="tech-tag">${c}</span>`).join('') 
      : '';

    list.innerHTML += `
      <div id="${edu.id}" class="row g-5 mb-5 pb-5 ${i < D.education.length - 1 ? 'border-bottom' : ''}" style="border-color:var(--border)!important;">
        <div class="col-lg-7 reveal visible">
          ${edu.image
            ? `<div class="detail-image-main" style="
                height: 520px; 
                max-width: 100%; 
                width: max-content;
                margin: 0 auto 36px auto; 
                border-radius: 16px; 
                overflow: hidden; 
                border: 1px solid var(--border); 
                box-shadow: var(--shadow-lg);
                background: transparent;
              ">
                <img src="../${edu.image}" alt="${edu.degree}" style="
                  height: 100%; 
                  width: auto; 
                  object-fit: contain; 
                  display: block;
                " />
              </div>`
            : `<div class="detail-image-main"><div class="detail-image-placeholder"><i class="bi bi-mortarboard"></i><p>Upload academic result/photo</p></div></div>`}
          
          ${coursesHtml ? `<h4 style="font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:14px;color:var(--text-primary);">Courses Studied</h4><div class="mb-3">${coursesHtml}</div>` : ''}
          
          ${edu.achievements ? `<p style="margin-top:16px;font-size:0.88rem;color:var(--text-secondary);"><i class="bi bi-trophy" style="color:var(--accent);"></i> ${edu.achievements}</p>` : ''}
        </div>
        <div class="col-lg-5 reveal visible">
          <span class="detail-badge">${edu.year}</span>
          <h2 style="font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;margin-bottom:8px;letter-spacing:-0.02em;color:var(--text-primary);">${edu.degree}</h2>
          <p style="color:var(--accent);font-weight:600;margin-bottom:6px;"><i class="bi bi-building"></i> ${edu.school}</p>
          <p style="color:var(--text-muted);font-size:0.88rem;margin-bottom:20px;"><i class="bi bi-geo-alt"></i> ${edu.location}</p>
          <p style="color:var(--text-secondary);line-height:1.7;margin-bottom:24px;">${edu.description}</p>
          
          <div class="info-box">
            <div class="info-box-label">Grade / Score</div>
            <div class="info-box-value" style="color:var(--accent);">${edu.grade}</div>
          </div>
          <div class="info-box">
            <div class="info-box-label">Duration</div>
            <div class="info-box-value">${edu.year}</div>
          </div>
          <div class="info-box">
            <div class="info-box-label">Institution</div>
            <div class="info-box-value">${edu.school}</div>
          </div>
        </div>
      </div>`;
  });

  // Inject footer icons safely
  const socialHtml = `
    <a href="${D.personal.github}" target="_blank" class="social-btn"><i class="bi bi-github"></i></a>
    <a href="${D.personal.linkedin}" target="_blank" class="social-btn"><i class="bi bi-linkedin"></i></a>`;
  document.getElementById('footer-social').innerHTML = socialHtml;
});
</script>
</body>
</html>
