<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects | Darsh</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="../index.html" id="nav-brand">Your<span>Name</span>.</a>
    <div class="d-flex align-items-center gap-3 order-lg-last">
      <div class="theme-toggle" id="themeToggle"><span class="toggle-icon" id="toggleIcon">🌙</span><div class="toggle-switch"></div></div>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
    </div>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto gap-1 py-2 py-lg-0">
        <li class="nav-item"><a class="nav-link" href="../index.html#hero">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="../index.html#education">Education</a></li>
        <li class="nav-item"><a class="nav-link" href="../index.html#internships">Internships</a></li>
        <li class="nav-item"><a class="nav-link active-section" href="../index.html#projects">Projects</a></li>
        <li class="nav-item"><a class="nav-link" href="../index.html#achievements">Achievements</a></li>
        <li class="nav-item"><a class="nav-link" href="../index.html#resume">Resume</a></li>
        <li class="nav-item"><a class="nav-link" href="../index.html#contact">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="detail-hero page-offset">
  <div class="container">
    <a href="../index.html#projects" class="back-link"><i class="bi bi-arrow-left"></i> Back to Home</a>
    <span class="section-label">My Work</span>
    <h1 class="detail-title">All Projects</h1>
    <div class="section-divider"></div>
    <p class="section-subtitle" style="max-width:560px;">Every project I've built — personal, academic, and open-source contributions.</p>
  </div>
</div>

<!-- Filter Tabs -->
<div style="background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:16px 0;position:sticky;top:70px;z-index:100;">
  <div class="container">
    <div class="d-flex gap-2 flex-wrap" id="filter-tabs">
      <button class="filter-btn active-filter" onclick="filterProjects('all', this)">All</button>
    </div>
  </div>
</div>

<div class="detail-content">
  <div class="container">
    <div class="row g-4" id="projects-detail-grid"></div>
  </div>
</div>

<footer>
  <div class="container">
    <div class="footer-brand" id="footer-brand">Darsh<span>Andharia</span>.</div>
    <div class="footer-social" id="footer-social"></div>
    <p class="footer-text">Crafted by Darsh &nbsp;·&nbsp; <span id="current-year"></span></p>
  </div>
</footer>

<style>
.filter-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);padding:6px 16px;border-radius:20px;font-size:0.82rem;font-weight:500;cursor:pointer;transition:all 0.2s ease;}
.filter-btn:hover,.filter-btn.active-filter{background:var(--accent);color:#fff;border-color:var(--accent);}
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/main.js"></script>
<script>
let allProjects = [];

document.addEventListener('DOMContentLoaded', () => {
  const D = PORTFOLIO_DATA;
  allProjects = D.projects;
  document.getElementById('nav-brand').innerHTML = `${D.personal.firstName}<span>${D.personal.lastName}</span>.`;

  // Build filter tabs
  const categories = [...new Set(D.projects.map(p=>p.category))];
  const tabs = document.getElementById('filter-tabs');
  categories.forEach(cat => {
    tabs.innerHTML += `<button class="filter-btn" onclick="filterProjects('${cat}', this)">${cat}</button>`;
  });

  renderProjects(D.projects);

  const socialHtml = `
    <a href="${D.personal.github}" target="_blank" class="social-btn"><i class="bi bi-github"></i></a>
    <a href="${D.personal.linkedin}" target="_blank" class="social-btn"><i class="bi bi-linkedin"></i></a>`;
  document.getElementById('footer-social').innerHTML = socialHtml;
  document.getElementById('footer-brand').innerHTML = `${D.personal.firstName}<span>${D.personal.lastName}</span>.`;
});

function filterProjects(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active-filter'));
  btn.classList.add('active-filter');
  const filtered = cat === 'all' ? allProjects : allProjects.filter(p=>p.category===cat);
  renderProjects(filtered);
}

function renderProjects(projects) {
  const grid = document.getElementById('projects-detail-grid');
  grid.innerHTML = '';
  projects.forEach(proj => {
    grid.innerHTML += `
      <div class="col-md-6 col-lg-4 reveal" id="${proj.id}">
        <div class="portfolio-card">
          <div class="card-img-wrapper">
            ${proj.image
              ? `<img src="../${proj.image}" alt="${proj.title}" />`
              : `<div class="card-img-placeholder"><i class="bi bi-code-slash"></i><span>${proj.category}</span></div>`}
            ${proj.featured ? `<div style="position:absolute;top:12px;right:12px;background:var(--accent);color:#fff;font-size:0.7rem;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:0.04em;">FEATURED</div>` : ''}
          </div>
          <div class="card-body-custom">
            <span class="card-tag">${proj.category}</span>
            <div class="card-title-custom">${proj.title}</div>
            <p class="card-text-custom">${proj.description}</p>
            <h6 style="font-size:0.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">Highlights</h6>
            <ul style="padding-left:18px;color:var(--text-secondary);margin-bottom:14px;">
              ${proj.highlights.map(h=>`<li style="font-size:0.83rem;margin-bottom:4px;">${h}</li>`).join('')}
            </ul>
            <div class="mb-3">${proj.tech.map(t=>`<span class="tech-tag">${t}</span>`).join('')}</div>
            <div class="d-flex gap-3 flex-wrap">
              ${proj.github ? `<a href="${proj.github}" target="_blank" class="btn-card"><i class="bi bi-github"></i> GitHub</a>` : ''}
              ${proj.live ? `<a href="${proj.live}" target="_blank" class="btn-card"><i class="bi bi-box-arrow-up-right"></i> Live Demo</a>` : ''}
            </div>
          </div>
        </div>
      </div>`;
  });
  // Re-observe for reveal
  document.querySelectorAll('.reveal:not(.visible)').forEach(el => {
    el.style.opacity='1'; el.style.transform='none';
  });
}
</script>
</body>
</html>
